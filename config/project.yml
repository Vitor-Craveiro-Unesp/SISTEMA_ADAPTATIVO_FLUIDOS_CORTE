# ------------------------------------------------------------
# 1. PROJETO
# ------------------------------------------------------------

project:

  id: "fluidos_corte"

  name: "Sistema Adaptativo de Classificação Multicritério de Fluidos de Corte"

  short_name: "Fluidos de Corte"

  type: "Trabalho de Laboratório de Estatística"

  year: 2026

  language: "pt-BR"

  status: "BASE_PREPARED"

  repository_status: "LOCAL"

  scientific_execution_status: "NOT_STARTED"


# ------------------------------------------------------------
# 2. OBJETIVO GERAL
# ------------------------------------------------------------

objective:

  main: >
    Construir um sistema estatístico e multicritério transparente,
    reproduzível e tecnicamente interpretável para comparar e
    classificar fluidos de corte a partir dos dados experimentais
    disponíveis.

  decision_goal: >
    Produzir uma classificação das alternativas baseada em dados
    auditados, critérios justificados, ponderação CRITIC, TOPSIS e
    análises de robustez.

  ranking_status: "NOT_GENERATED"


# ------------------------------------------------------------
# 3. PRINCÍPIO METODOLÓGICO
# ------------------------------------------------------------

methodology:

  workflow:

    - "DATA_INVENTORY"
    - "DATA_AUDIT"
    - "DATA_RECONCILIATION"
