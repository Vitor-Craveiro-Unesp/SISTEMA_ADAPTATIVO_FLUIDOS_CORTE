name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build container
        run: docker compose build

      - name: Run tests
        run: docker compose run --rm r Rscript -e "testthat::test_dir('tests/testthat')"
