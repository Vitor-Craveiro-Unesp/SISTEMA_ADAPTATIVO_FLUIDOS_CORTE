  double_cost_inversion:
    allowed: false

  alternative_method_for_robustness:
    planned: true


# ------------------------------------------------------------
# 19. CRITIC
# ------------------------------------------------------------

critic:

  status: "NOT_EXECUTED"

  formula:

    information:
      expression: "C_j = sigma_j * sum_k(1 - r_jk)"

    weights:
      expression: "w_j = C_j / sum_j(C_j)"

  conflict_expression: "1 - r_jk"

  use_absolute_correlation:
    value: false

  equal_weight_fallback:
    allowed: false

  interpretation: "INFORMATION_WEIGHT"


# ------------------------------------------------------------
# 20. TOPSIS
# ------------------------------------------------------------

topsis:

  status: "NOT_EXECUTED"

  weighted_matrix:
    expression: "v_ij = w_j * r_ij"

  positive_distance:
    expression: "S_i_plus = sqrt(sum_j((v_ij - v_j_plus)^2))"

  negative_distance:
    expression: "S_i_minus = sqrt(sum_j((v_ij - v_j_minus)^2))"

  closeness:
    expression: "C_i = S_i_minus / (S_i_plus + S_i_minus)"

  expected_closeness_range:

    min: 0

    max: 1

  primary_ranking:
    order: "DESCENDING_CLOSENESS"

  ranking_status: "NOT_GENERATED"


# ------------------------------------------------------------
# 21. PARETO
# ------------------------------------------------------------

pareto:

  status: "NOT_EXECUTED"

  use_weights: false

  require_oriented_criteria: true

  self_dominance:
    allowed: false

  strict_improvement_in_at_least_one_criterion:
    required: true


# ------------------------------------------------------------
