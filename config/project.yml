    - "MULTIVARIATE_ADA"
    - "TECHNICAL_CONFORMITY"
    - "CRITERIA_DEFINITION"
    - "DECISION_MATRIX"
    - "NORMALIZATION"
    - "CRITIC"
    - "TOPSIS"
    - "SCENARIOS"
    - "PARETO"
    - "SENSITIVITY"
    - "ROBUSTNESS"
    - "FINAL_INTERPRETATION"

  ranking_method: "TOPSIS"

  weighting_method: "CRITIC"

  pareto_analysis: true

  robustness_analysis: true

  black_box_decision_model:
    allowed: false

  explainability:
    required: true

  reproducibility:
    required: true


